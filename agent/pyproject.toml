[project]
name = "voice-agent-starfield"
version = "0.1.0"
description = "AstroLB-3: Private suit AI companion for Starfield using LiveKit voice agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "livekit-agents>=0.9.0",
    "livekit-plugins-openai>=0.7.0",
    "livekit-plugins-silero>=0.6.0",
    "livekit-plugins-turn-detector>=0.6.0",
    "python-dotenv>=1.0.0",
    "lancedb>=0.13.0",
    "youtube-transcript-api>=0.6.0",
    "yt-dlp>=2024.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "black>=24.0.0",
    "ruff>=0.1.0",
]

[tool.black]
line-length = 100
target-version = ["py311", "py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
